<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>خوشآمدید</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            direction: rtl;
        }
        
        .container {
            text-align: center;
            background: white;
            padding: 60px 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            animation: slideIn 0.8s ease-out;
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        h1 {
            color: #667eea;
            font-size: 48px;
            margin-bottom: 20px;
            animation: fadeIn 1s ease-out;
        }
        
        p {
            color: #666;
            font-size: 18px;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        
        .welcome-text {
            color: #764ba2;
            font-weight: bold;
            font-size: 24px;
            margin: 20px 0;
        }
        
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 16px;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            margin: 10px;
            font-weight: bold;
        }
        
        button:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }
        
        .emoji {
            font-size: 60px;
            margin: 20px 0;
            animation: bounce 2s infinite;
        }
        
        @keyframes bounce {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-20px);
            }
        }
        
        .time {
            color: #999;
            font-size: 14px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="emoji">👋</div>
        <h1>خوشآمدید!</h1>
        <p>به صفحه ما خوش آمدید</p>
        <div class="welcome-text" id="greeting">سلام مهمان گرامی!</div>
        <p>ما خوشحال هستیم که از ما دیدن می‌کنید 😊</p>
        <button onclick="showAlert()">برای من پیام بفرستید</button>
        <button onclick="getName()">معرفی کنید</button>
        <div class="time" id="time"></div>
    </div>
    
    <script>
        // نمایش ساعت
        function updateTime() {
            const now = new Date();
            const timeStr = now.toLocaleTimeString('fa-IR');
            document.getElementById('time').textContent = 'ساعت: ' + timeStr;
        }
        updateTime();
        setInterval(updateTime, 1000);
        
        // پیام خوشامدی
        function showAlert() {
            alert('🎉 از بازدید شما متشکریم! 🎉');
        }
        
        // دریافت نام
        function getName() {
            const name = prompt('نام خود را وارد کنید:');
            if (name) {
                document.querySelector('.welcome-text').textContent = 'سلام ' + name + '! 👋';
            }
        }
    </script>
</body>
</html>
